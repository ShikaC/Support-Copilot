name: React Web CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  react-web:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/support-copilot-web

    steps:
      - name: Check out repository
        # actions/checkout v7.0.1，固定 SHA 防止版本标签被替换。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js 24
        # actions/setup-node v7.0.0，固定 SHA 保证 Node.js 来源可追溯。
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/support-copilot-web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Run frontend unit tests
        run: npm run test

      - name: Build frontend
        run: npm run build
