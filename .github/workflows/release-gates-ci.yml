name: Non-container Release Gates CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-gates:
    name: Workflow, security, and dependency gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository with history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/support-copilot-ai/requirements-dev.lock.txt

      - name: Install release gate prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          python -m pip install --require-hashes -r services/support-copilot-ai/requirements-dev.lock.txt

      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669

      - name: Set up Go 1.26.4
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: 1.26.4
          cache: false

      - name: Run non-container release gates
        env:
          TMPDIR: ${{ runner.temp }}
          SUPPORT_COPILOT_CI_TOOLS_DIR: ${{ runner.temp }}/support-copilot-ci-tools
        run: ./scripts/verify-ci-gates.sh --mode release
