name: Java API CI

on:
  push:
  pull_request:

# 编译和测试只需要读取代码，不应获得仓库写入权限。
permissions:
  contents: read

jobs:
  java-api:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/support-copilot-api

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2，固定 SHA 防止版本标签被替换。
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Java 21
        # actions/setup-java v5.6.0，固定 SHA 保证 JDK 来源可追溯。
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        # gradle/actions/setup-gradle v6.3.0，验证 Wrapper 并缓存 Gradle 依赖。
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669

      - name: Run Java tests
        run: ./gradlew test --no-daemon
