name: Python AI CI

on:
  push:
  pull_request:

# CI 只需要读取仓库内容，不应拥有修改代码或发布版本的权限。
permissions:
  contents: read

jobs:
  python-ai:
    name: Check, test, and evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/support-copilot-ai

    steps:
      - name: Check out repository
        # actions/checkout v6.0.2，固定 SHA 防止版本标签被替换。
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Python 3.11
        # actions/setup-python v6.2.0，固定 SHA 保证运行环境可追溯。
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/support-copilot-ai/requirements-dev.lock.txt

      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Check dependency locks
        run: python -m scripts.check_dependency_locks

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run mock evaluation
        run: python -m evaluation.run_mock_evaluation
