spring.datasource.url=${SUPPORT_COPILOT_DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SUPPORT_COPILOT_DB_USERNAME}
spring.datasource.password=${SUPPORT_COPILOT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.h2.console.enabled=false
support-copilot.demo-fixtures.enabled=false
support-copilot.security.business-access=jwt
support-copilot.security.internal-service-token=${SUPPORT_COPILOT_INTERNAL_SERVICE_TOKEN}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPPORT_COPILOT_JWT_ISSUER_URI:}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPPORT_COPILOT_JWT_JWK_SET_URI:}
support-copilot.security.jwt-audience=${SUPPORT_COPILOT_JWT_AUDIENCE}
