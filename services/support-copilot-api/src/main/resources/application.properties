spring.application.name=support-copilot-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:h2:mem:supportcopilot;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:15000}

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{32} - %msg%n
