spring.application.name=support-copilot-api
server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:105000}
evaluation.report-path=${EVALUATION_REPORT_PATH:../support-copilot-ai/evaluation/reports/mock-latest.json}

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{32} - %msg%n
