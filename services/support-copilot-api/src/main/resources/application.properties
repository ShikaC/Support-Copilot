spring.application.name=support-copilot-api
server.port=${SERVER_PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.timeout-ms=${AI_SERVICE_TIMEOUT_MS:105000}
ai.service.retry-max-attempts=${AI_SERVICE_RETRY_MAX_ATTEMPTS:2}
ai.service.retry-wait-ms=${AI_SERVICE_RETRY_WAIT_MS:100}
ai.service.circuit-sliding-window-size=${AI_SERVICE_CIRCUIT_WINDOW_SIZE:10}
ai.service.circuit-minimum-calls=${AI_SERVICE_CIRCUIT_MINIMUM_CALLS:5}
ai.service.circuit-failure-rate-threshold=${AI_SERVICE_CIRCUIT_FAILURE_RATE:50}
ai.service.circuit-open-ms=${AI_SERVICE_CIRCUIT_OPEN_MS:30000}
ai.service.bulkhead-max-concurrent-calls=${AI_SERVICE_BULKHEAD_MAX_CONCURRENT_CALLS:8}
ai.service.bulkhead-max-wait-ms=${AI_SERVICE_BULKHEAD_MAX_WAIT_MS:0}
evaluation.report-path=${EVALUATION_REPORT_PATH:../support-copilot-ai/evaluation/reports/mock-latest.json}

# The corpus checksum is the canonical SHA-256 of sorted, compact chunk JSON, not the raw file SHA.
support-copilot.knowledge.baseline.release-id=${KNOWLEDGE_BASELINE_RELEASE_ID:support-copilot-bundled-v1}
support-copilot.knowledge.baseline.release-version=${KNOWLEDGE_BASELINE_RELEASE_VERSION:1}
support-copilot.knowledge.baseline.corpus-checksum=${KNOWLEDGE_BASELINE_CORPUS_CHECKSUM:b25240587df1ebb903a8555284a0f35faaa35e2d837add0fc5dd49418ca8b874}

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{traceId:-no-trace}] %logger{32} %kvp - %msg%n
