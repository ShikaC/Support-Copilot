server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:supportcopilot-demo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
support-copilot.demo-fixtures.enabled=true
support-copilot.security.business-access=anonymous-demo
support-copilot.security.internal-service-token=${SUPPORT_COPILOT_INTERNAL_SERVICE_TOKEN:synthetic-demo-internal-service-token}
