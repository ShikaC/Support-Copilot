# Local anonymous demo with durable data; never enable this profile on a public listener.
spring.datasource.url=jdbc:h2:file:${SUPPORT_WORKSPACE_DB_PATH};MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
support-copilot.demo-fixtures.enabled=true
