spring.datasource.url=jdbc:h2:mem:supportcopilot-test-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=false
support-copilot.demo-fixtures.enabled=false
support-copilot.security.business-access=jwt
support-copilot.security.internal-service-token=${SUPPORT_COPILOT_INTERNAL_SERVICE_TOKEN:synthetic-test-internal-service-token}
support-copilot.security.test-jwt-secret=${SUPPORT_COPILOT_TEST_JWT_SECRET:synthetic-test-jwt-signing-key-32-bytes-minimum}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPPORT_COPILOT_JWT_ISSUER_URI:https://issuer.test/support-copilot}
support-copilot.security.jwt-audience=${SUPPORT_COPILOT_JWT_AUDIENCE:support-copilot-api}
